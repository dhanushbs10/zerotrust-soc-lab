title: Pod logs of a business-zone workload read by an operator identity
id: 03170000-0000-4000-8000-000000000004
status: experimental
description: |
  The logs of a workload in one of the three lab trust zones were read by
  `kubernetes-admin` rather than by a workload identity.

  This is the weakest mapping in the set, and the registry says so
  ----------------------------------------------------------------
  `telemetry/tag-attack-ids.ps1` flags T1552.001 on `runtime/pod-log-read/v1`
  as a `[WEAK MAPPING]`, and that flag is carried into this rule rather than
  quietly dropped. Reading pod logs is not credential access. It is a *place*
  credentials end up: SP-01's walk runs `psql` with an inline `PGPASSWORD`
  inside `postgres-0`, so a query string containing the leaked password is
  written to that pod's stdout and is readable by anyone who can read its logs.

  The stronger signal for this technique is DET-0003, which sees the credential
  being used at the moment it is passed. This rule covers the residue.

  Why the reader is part of the predicate
  ---------------------------------------
  50 log reads were recorded. 22 of them are not interesting: the local-path
  provisioner reading its own helper pods, and reads of kube-system components.
  The remaining 28 are `kubernetes-admin` reading a business-zone workload,
  which is the shape an investigation takes and also the shape a credential
  harvest takes. The rule narrows to the lab zones and to an operator identity
  so that the 22 routine reads stay quiet.
author: ZeroTrust-SOC-Lab
references:
  - https://attack.mitre.org/techniques/T1552/001/
logsource:
  product: zerotrust-soc-lab
  category: kubernetes
  schema: runtime/pod-log-read/v1
detection:
  sel_schema:
    schema: runtime/pod-log-read/v1

  sel_lab_zone:
    namespace:
      - zerotrust
      - zerotrust-build
      - zerotrust-observe

  sel_operator:
    identity.effectiveIdentity: kubernetes-admin

  condition: sel_schema and sel_lab_zone and sel_operator
fields:
  - auditId
  - namespace
  - pod
  - resolvedWorkload
  - identity.effectiveIdentity
  - sourceIPs
  - userAgent
  - responseCode
falsepositives:
  - Ordinary debugging. In this lab every log read is one, because the operator
    host is the only thing driving the cluster. The technique mapping is weak
    enough that this rule should be triaged alongside DET-0003 rather than on its
    own.
level: low
tags:
  - attack.t1552.001
