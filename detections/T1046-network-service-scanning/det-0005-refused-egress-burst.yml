title: Egress denied repeatedly by a NetworkPolicy on one pod
id: 03170000-0000-4000-8000-000000000005
status: experimental
description: |
  A pod's firewall chain recorded refused packets since the previous collection,
  and the counter was genuinely comparable to the one before it.

  Why baselineState is in the predicate
  -------------------------------------
  This is a counter, not a flow log, so the collector cannot see a destination
  and can only report a delta. kube-router v2.6.1 rebuilds a chain when its
  policy set changes, and a node reboot zeroes the counters, and either event
  makes a subtraction meaningless. The collector models four states for exactly
  this reason and emits a delta only when the state is `compared`.

  Matching on `deniedPackets > 0` without requiring `compared` would fire on
  every chain in the cluster immediately after a restart, because the absolute
  counter is non-zero on any pod that has ever been refused. That is a rule that
  fires on a reboot.

  What the number means
  ---------------------
  `packetsPerRefusal` is measured at 2 per refused connection attempt, and
  retries to an already-refused pod IP and port are counted again. So the delta
  approximates connection *attempts*, not distinct flows, and a delta of 2 is one
  refused connection rather than two. A single refusal is a misconfiguration;
  a sustained delta is scanning.

  The limitation is stated rather than papered over: the enforcement point
  records neither port nor destination, so this rule identifies *which pod* was
  refused and cannot say what it was reaching for.
author: ZeroTrust-SOC-Lab
references:
  - https://attack.mitre.org/techniques/T1046/
logsource:
  product: zerotrust-soc-lab
  category: kubernetes
  schema: network/denial-counter/v1
  # The precondition this rule needs, declared so the gate can tell "this rule is
  # broken" apart from "this window cannot judge it".
  #
  # Network telemetry here is counter-based, and a counter delta is only defined
  # when two reads saw the same iptables chain. kube-router rebuilds those chains
  # whenever policy changes, and it resets the counters to zero when it does. The
  # collector is explicit about this -- `baselineState: chain-rebuilt`,
  # `deltaValid: false`, `deltaDenied: null` -- rather than reporting the absolute
  # count as if it were new traffic, so a rule keying on `deltaDenied > 0` is
  # correct to match nothing after a policy change.
  #
  # That makes a run with no comparable delta a real situation rather than a
  # hypothetical one, and it happens on any run where the graph stage has just
  # rebuilt the firewall. Without this declaration the gate reports such a rule as
  # "matched nothing, which is indistinguishable from working", which is both
  # wrong and unfixable without lying in one direction or the other.
  #
  # This is a precondition on the WINDOW, not a discount on the rule. If a
  # comparable delta exists, the rule is held to its baseline count and to liveness
  # like any other, with no exemption available.
  requires:
    field: baselineState
    equals: compared
detection:
  sel:
    schema: network/denial-counter/v1

  # Only a delta between two comparable chains carries information.
  sel_compared:
    baselineState: compared

  sel_denied:
    counter.deltaDenied|gt: 0

  filter_invalid:
    deltaValid: false

  # The collector already refuses to emit a delta it does not believe, so this
  # is belt and braces -- and it is asserted by the test suite, because a
  # redundant guard that silently stops matching is worse than no guard.
  condition: sel and sel_compared and sel_denied and not filter_invalid
fields:
  - node
  - chain
  - subject.namespace
  - subject.pod
  - subject.serviceAccount
  - counter.deniedPackets
  - counter.deltaDenied
  - baselineState
  - policiesApplied
falsepositives:
  - A pod whose Service was recreated or whose client is retrying a connection
    during a rollout. Triage on whether the delta is sustained across several
    collections rather than appearing once.
level: medium
tags:
  - attack.t1046
