title: Container exec reading a credential or probing for an escape
id: 03170000-0000-4000-8000-000000000003
status: experimental
description: |
  An interactive command session was opened inside a running container and the
  command touched a credential path or performed escape reconnaissance.

  Why this keys on the command and not the identity
  -------------------------------------------------
  Every one of the 978 exec sessions in this cluster was opened by
  `kubernetes-admin`, because the lab is driven from the operator host. An
  identity-based rule would fire on all 978 and mean nothing. So the rule
  discriminates on *what was run*, which is also the more portable choice: in a
  real cluster the interesting signal is the command, not which of your own
  automation accounts happened to run it.

  Two families of command are treated as hostile:

    credential access  the projected service account token path, a database
                       client invoked with an inline PGPASSWORD, or a query
                       against pg_authid
    escape probing     /proc/1/root and a writability test against /etc/passwd

  Both are from the catalogued walks: PP-01 and WP-02 read the token off disk,
  SP-01 spends the leaked password, and WP-01 measures what uid 0 is worth.

  What this rule deliberately does not do
  ---------------------------------------
  It does not match on the leaked password's value. The password appears
  verbatim in this lab's telemetry, so a rule carrying the literal would be a
  rule that knows the secret in order to find the secret. `PGPASSWORD=` is
  matched as a shape, which is also what would survive the credential being
  rotated.

  portforward sessions are excluded and belong to DET-0010. They arrive in the
  same schema and a rule that did not exclude them would report a tunnel as a
  container exec.
author: ZeroTrust-SOC-Lab
references:
  - https://attack.mitre.org/techniques/T1609/001/
  - https://attack.mitre.org/techniques/T1550/001/
logsource:
  product: zerotrust-soc-lab
  category: kubernetes
  schema: runtime/container-exec/v1
detection:
  sel_schema:
    schema: runtime/container-exec/v1

  sel_exec:
    subresource: exec

  # The session must have been granted. A refused request never ran a command,
  # and counting it would report every RBAC denial as an intrusion.
  sel_granted:
    granted: true

  sel_credential:
    commandLine|contains:
      - /var/run/secrets/kubernetes.io/serviceaccount/token
      - PGPASSWORD=
      - pg_authid

  sel_escape:
    commandLine|contains:
      - /proc/1/root
      - /etc/passwd

  filter_portforward:
    subresource: portforward

  condition: sel_schema and sel_exec and sel_granted and (sel_credential or sel_escape) and not filter_portforward

fields:
  - auditId
  - target.namespace
  - target.pod
  - identity.effectiveIdentity
  - commandLine
  - granted
  - outcome
falsepositives:
  - A legitimate break-glass exec that reads a mounted token, for example during
    an incident. Triage on target.pod and on whether a change record exists.
level: high
tags:
  - attack.t1609.001
  - attack.t1550.001
