# Template for lab credentials. This file IS committed; the file you copy it to
# is not. See secrets/README.md.
#
# Why the separation exists: a credential in git is a credential in every clone,
# in the CI history, and in the backups of both. In a lab it is only a fake
# password -- but the habit is the part that matters, and a repo that teaches
# "just commit the password, it's a lab" teaches the wrong lesson.
#
# Generate a working copy:
#   Copy-Item secrets\credentials.example.yaml secrets\credentials.yaml
#
postgres:
  # Database superuser password. Generated, never typed by a human.
  password: "REPLACE_ME"
  # A second, deliberately weaker credential. It exists so SP-01 has something
  # worth leaking: a password that is only weak because it was copied out of a
  # secure store into a readable one.
  legacy_password: "REPLACE_ME"
build:
  # Token for the fake CI provider. Unused by any workload, present so the
  # detector has a second Secret to find when Phase 4 escalates.
  token: "REPLACE_ME"
