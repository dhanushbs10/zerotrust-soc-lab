extends: default

rules:
  line-length:
    max: 200
    level: warning
  comments:
    min-spaces-from-content: 1
  document-start:
    present: true
  truthy:
    allowed-values: ["true", "false"]
  indentation:
    spaces: 2
    # Always indent block sequences under their key. `consistent` is stricter
    # on paper and worse in practice: it infers the expected style from the
    # first sequence in the file, so one vendored manifest using the other
    # convention turns every rule block in the repo into an error.
    indent-sequences: true
  empty-lines:
    max: 2
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
