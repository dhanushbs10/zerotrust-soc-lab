# Non-secret configuration. Everything in this file is safe to commit: no
# credential values, only the names of things and the settings that are meant
# to be readable.
#
# The contrast with secrets/local/ is the point. When a password ends up in a
# ConfigMap, it is usually not malice, it is convenience: ConfigMaps can be
# committed, diffed and read by anyone with `get configmaps`, and a Secret
# would have forced a conversation about handling. weaknesses.yaml catalogues
# the case where that reasoning won.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  namespace: zerotrust
data:
  LOG_LEVEL: "info"
  # Where to find the credential. The value lives in a Secret and is projected
  # into the pod at runtime, so it is not in git and not in this object.
  DB_PASSWORD_SECRET: "postgres-credentials"
  DB_USER: "orders"
  DB_HOST: "postgres.zerotrust.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "acme"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-catalog
  namespace: zerotrust
  labels:
    zerotrust.lab/purpose: documentation
data:
  # The weaknesses and privilege paths planted in this lab, in a form the
  # telemetry agent and the risk graph can both read. Keeping the catalogue in
  # the cluster means a detection can be checked against ground truth instead of
  # against someone's memory.
  #
  # The authoritative copy is attack/catalog/privilege-paths.md. This is a
  # machine-readable subset, and drift between the two is itself a finding:
  # a detection that fires on a condition the catalogue no longer lists is
  # either a false positive or a documentation bug.
  weaknesses.yaml: |
    weaknesses:
      - id: WP-01
        name: web-frontend runs as root
        resource: Deployment/web-frontend
        attack_id: T1610
        detection: DET-0007
      - id: WP-02
        name: telemetry-agent mounts a token that grants nothing
        resource: ServiceAccount/sa-telemetry-agent
        attack_id: T1550.001
        detection: DET-0009
      - id: SP-01
        name: database password duplicated in a ConfigMap
        resource: ConfigMap/app-config-leak
        attack_id: T1552.001
        detection: DET-0002
  privileges.yaml: |
    privilege_paths:
      - id: PP-01
        name: sa-build-runner bound to cluster-admin
        resource: ClusterRoleBinding/build-runner-cluster-admin
        attack_id: T1078.001
        related_ids: [T1098.003]
        detection: DET-0001
        network_isolated: true
        network_isolation_matters: false
      - id: PP-02
        name: sensor holds a network path to all business workloads
        resource: NetworkPolicy (3 ingress rules)
        attack_id: T1078.001
        related_ids: [T1046]
        detection: DET-0008
        network_isolated: false
        network_isolation_matters: true
  privileges.md: |
    PP-01 build-runner holds cluster-admin.
      Network: isolated, DNS only.
      Control plane: total. Reads every Secret, creates pods anywhere.
      The isolation is real and does not help. Control-plane access is not
      pod-to-pod traffic, so no network policy is in a position to stop it.
      Compensating control: none. That is the failure.

    PP-02 the sensor can reach web-frontend, orders-api and postgres.
      Granted on purpose, because a monitor with no reach cannot tell healthy
      from unreachable.
      Survives because sa-telemetry-agent holds no API permissions and no
      database credential, so the path leads to a closed door.
      Risk: compromising the sensor inherits observation of the business zone.
