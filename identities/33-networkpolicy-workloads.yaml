# Business-zone flows in the `zerotrust` namespace.
#
# Every rule below corresponds to one line of the fake company's architecture, and
# nothing here is broader than that line needs. If a rule cannot be traced to a
# specific requirement, it is an over-permission and should be deleted.
#
# Permitted:
#   web-frontend  -> orders-api                 on 8080
#   orders-api    -> postgres                   on 5432
#   telemetry-agent -> web-frontend            on 80    (PP-02)
#   telemetry-agent -> orders-api              on 8080  (PP-02)
#   telemetry-agent -> postgres                on 5432  (PP-02)
#
# Not permitted, and the absence is the control:
#   web-frontend  -> postgres    a web server has no reason to hold a DB session
#   postgres      -> anywhere    a database that initiates traffic is exfiltrating
#   orders-api    -> web-frontend  the API does not call the frontend
#   anything      -> build       the build zone is not on any request path
#   build-runner  -> zerotrust   see 34-networkpolicy-zones.yaml
#
# Verified by measurement (Phase 6). All five of those absences were read off the
# live policies by graph/build-reachability.ps1 and then checked with real TCP
# connections: every one came back dropped, no packet answered, 1000ms or more
# each. The three paths that do exist were confirmed the same way. The list above
# was previously a claim about the manifests; it is now a claim about the
# datapath, which is the only kind worth making about containment.
#
# ---------------------------------------------------------------------------
# A dead ingress allowance, found by tools/test-boundaries.ps1
# ---------------------------------------------------------------------------
# This file originally listed web-frontend-ingress as admitting `app:
# web-frontend` and `app: orders-api`, and wrote a test asserting both could
# connect. The test failed. The policies were right and the test's expectation
# was wrong, which is the only acceptable direction for a test to be wrong in.
#
# An ingress rule names who may connect to a pod. It says nothing about whether
# those pods can connect outward, and egress is a separate policy on a separate
# axis. `web-frontend-egress` permits only orders-api:8080, and
# `orders-api-egress` permits only postgres:5432, so neither of them can reach
# web-frontend:80 at all. The two ingress allowances matched no packet and never
# would have.
#
# Both halves are true and the combination is what surprises people: the policy
# says the frontend is reachable from two sources, and it is reachable from
# neither. Reviewed on its own, the ingress rule looks permissive and reasonable.
# Only a test that actually opens the connection reveals that an allowance can
# be live in review and dead in the datapath.
#
# The correct fix is deletion, not an added egress rule. Making orders-api able
# to call the frontend in order to justify an allowance that nothing needs would
# be adding an attack path to preserve dead configuration. So web-frontend-ingress
# now admits the sensor and nobody else. Every rule in this file is live, which
# is the property that makes the file worth trusting.
#
# ---------------------------------------------------------------------------
# The rule that is easy to forget, and cost this lab an afternoon
# ---------------------------------------------------------------------------
# A NetworkPolicy is not a one-sided permission. A connection is allowed only
# when the SOURCE's egress policy permits it AND the DESTINATION's ingress policy
# permits it. Both sides must agree.
#
# The first version of the telemetry agent reported every service unreachable.
# Its own egress policy was correct and the policies here were correct. The bug
# was in the agent's expectation: it assumed its own egress was sufficient and
# never checked that these ingress rules had not granted it anything.
#
# `default-deny-all` denies both directions, so the agent was denied here even
# though it was permitted by its own namespace. Ingress rules add permissions
# only for the named pods; they never imply one.
#
# That is why observation access is granted explicitly below rather than
# assumed. PRIVERGE PATH PP-02.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-frontend-ingress
  namespace: zerotrust
spec:
  podSelector:
    matchLabels:
      app: web-frontend
  policyTypes:
    - Ingress
  ingress:
    # PP-02: observation access for the sensor, and the only ingress this
    # workload has. Scoped to the single telemetry-agent pod by both namespace
    # and pod selector, so a second pod dropped into the observe namespace does
    # not inherit it.
    #
    # The business path to the frontend ends at the frontend: nothing in this
    # cluster serves it, because there is no external ingress controller. In a
    # real deployment this is where a gateway, an ingress controller or a CDN
    # would be named, and the rule would be a real requirement rather than a
    # sensor making an observation call.
    - from:
        - namespaceSelector:
            matchLabels:
              zerotrust.lab/zone: observe
          podSelector:
            matchLabels:
              app: telemetry-agent
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-frontend-egress
  namespace: zerotrust
spec:
  podSelector:
    matchLabels:
      app: web-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: orders-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api-ingress
  namespace: zerotrust
spec:
  podSelector:
    matchLabels:
      app: orders-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-frontend
      ports:
        - protocol: TCP
          port: 8080
    # PP-02: observation access for the sensor.
    - from:
        - namespaceSelector:
            matchLabels:
              zerotrust.lab/zone: observe
          podSelector:
            matchLabels:
              app: telemetry-agent
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api-egress
  namespace: zerotrust
spec:
  podSelector:
    matchLabels:
      app: orders-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: zerotrust
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orders-api
      ports:
        - protocol: TCP
          port: 5432
    # PP-02: observation access for the sensor.
    #
    # This is the rule to be most uncomfortable about. It hands the sensor a
    # network path to the database, which is the asset the whole lab protects.
    # It is here because a SOC that cannot probe the database cannot tell
    # "healthy" from "unreachable", and silently losing that distinction is how
    # an outage becomes an incident.
    #
    # The compensating control is that sa-telemetry-agent holds no database
    # credential. It can open a TCP connection to 5432 and no further, which is
    # the difference between "can see that the door is open" and "can walk
    # through it". Removing the credential is what keeps PP-02 survivable.
    - from:
        - namespaceSelector:
            matchLabels:
              zerotrust.lab/zone: observe
          podSelector:
            matchLabels:
              app: telemetry-agent
      ports:
        - protocol: TCP
          port: 5432
