# One ServiceAccount per workload. No workload shares the `default` account.
#
# Why this matters: `default` is a single identity, so every pod in a namespace
# that uses it is indistinguishable in the audit log. Give each workload its own
# account and the audit log answers "which app did this" without guesswork.
# That is the difference between an investigable cluster and an opaque one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-web-frontend
  namespace: zerotrust
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-orders-api
  namespace: zerotrust
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-postgres
  namespace: zerotrust
---
# sa-telemetry-agent is declared in 20-rbac.yaml rather than here, because the
# interesting fact about it is which permissions it does NOT have, and that
# belongs next to the RBAC discussion rather than separated from it.
---
# PRIVERGE PATH PP-01: this account is deliberately over-privileged.
# See attack/catalog/privilege-paths.md. Do not "fix" it: the lab needs it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-build-runner
  namespace: zerotrust-build
  annotations:
    zerotrust.lab/privilege-path: PP-01
    zerotrust.lab/attack-id: T1078.001
