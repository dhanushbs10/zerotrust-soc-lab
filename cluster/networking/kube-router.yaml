# kube-router: pod networking plus Kubernetes NetworkPolicy enforcement.
#
# kind's default CNI (kindnet) routes pod traffic but IGNORES NetworkPolicy
# objects entirely, which would make every policy in this lab decorative.
# kube-router was chosen over Calico because this machine has ~2.3 GB free
# RAM: it is a single DaemonSet with no operator and no CRDs.
#
# Source: https://raw.githubusercontent.com/cloudnativelabs/kube-router/v2.6.1/daemonset/kubeadm-kuberouter-all-features.yaml
# Pinned to tag v2.6.1 by multi-arch index digest. The digest was confirmed
# against the digest containerd reports on the running node. If you change the
# tag, change the digest in the same commit.
#
# Reformatted from upstream to satisfy this repo's yamllint: block sequences are
# indented consistently, and two misindented lines in the upstream ClusterRole
# (`- "coordination.k8s.io"` at 6 spaces where its siblings use 4) are fixed.
# The reformat is whitespace only. Compare against upstream with:
#     kubectl kustomize cluster/networking > /dev/null   # structural check
# and re-fetch the source URL above when auditing a version bump.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-router-cfg
  namespace: kube-system
  labels:
    tier: node
    k8s-app: kube-router
data:
  cni-conf.json: |
    {
       "cniVersion":"0.3.0",
       "name":"mynet",
       "plugins":[
          {
             "name":"kubernetes",
             "type":"bridge",
             "bridge":"kube-bridge",
             "isDefaultGateway":true,
             "hairpinMode":true,
             "ipam":{
                "type":"host-local"
             }
          }
       ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    k8s-app: kube-router
    tier: node
spec:
  selector:
    matchLabels:
      k8s-app: kube-router
      tier: node
  template:
    metadata:
      labels:
        k8s-app: kube-router
        tier: node
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: kube-router
      serviceAccount: kube-router
      containers:
        - name: kube-router
          image: docker.io/cloudnativelabs/kube-router@sha256:5215719695add13b2351688a1ca222c5a2f2f26b0f50d0fdbef2edabb9298632
          imagePullPolicy: Always
          args:
            - --run-router=true
            - --run-firewall=true
            - --run-service-proxy=true
            - --bgp-graceful-restart=true
            - --kubeconfig=/var/lib/kube-router/kubeconfig
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_ROUTER_CNI_CONF_FILE
              value: /etc/cni/net.d/10-kuberouter.conflist
          livenessProbe:
            httpGet:
              path: /healthz
              port: 20244
            initialDelaySeconds: 10
            periodSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 250Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: cni-conf-dir
              mountPath: /etc/cni/net.d
            - name: kubeconfig
              mountPath: /var/lib/kube-router
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
              readOnly: false
      initContainers:
        - name: install-cni
          image: docker.io/cloudnativelabs/kube-router@sha256:5215719695add13b2351688a1ca222c5a2f2f26b0f50d0fdbef2edabb9298632
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -e -x;
              if [ ! -f /etc/cni/net.d/10-kuberouter.conflist ]; then
                if [ -f /etc/cni/net.d/*.conf ]; then
                  rm -f /etc/cni/net.d/*.conf;
                fi;
                TMP=/etc/cni/net.d/.tmp-kuberouter-cfg;
                cp /etc/kube-router/cni-conf.json ${TMP};
                mv ${TMP} /etc/cni/net.d/10-kuberouter.conflist;
              fi;
              if [ -x /usr/local/bin/cni-install ]; then
                /usr/local/bin/cni-install;
              fi;
          volumeMounts:
            - name: cni-conf-dir
              mountPath: /etc/cni/net.d
            - name: kube-router-cfg
              mountPath: /etc/kube-router
            - name: host-opt
              mountPath: /opt
      hostNetwork: true
      hostPID: true
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
      volumes:
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: cni-conf-dir
          hostPath:
            path: /etc/cni/net.d
        - name: kube-router-cfg
          configMap:
            name: kube-router-cfg
        - name: kubeconfig
          configMap:
            name: kube-proxy
            items:
              - key: kubeconfig.conf
                path: kubeconfig
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: host-opt
          hostPath:
            path: /opt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-router
  namespace: kube-system
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - services
      - nodes
      - endpoints
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - "networking.k8s.io"
    resources:
      - networkpolicies
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - extensions
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - ""
    resources:
      - services/status
    verbs:
      - update
  - apiGroups:
      - "discovery.k8s.io"
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-router
subjects:
  - kind: ServiceAccount
    name: kube-router
    namespace: kube-system
