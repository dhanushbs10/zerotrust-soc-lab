repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local hook. `check-yaml` above is not sufficient on its own: it parses
  # successfully when a `---` separator is missing, because the duplicate
  # `apiVersion` key it creates is silently discarded. That is how six
  # NetworkPolicies disappeared from this repo while every other check passed.
  # This hook rejects duplicate keys outright, so a lost object is a build
  # failure rather than a missing control nobody notices.
  - repo: local
    hooks:
      - id: lab-yaml-strict
        name: strict YAML (duplicate keys, digest pins)
        entry: >-
          python tools/validate-yaml.py
          identities workloads cluster
        language: system
        pass_filenames: false
        files: \.(ya?ml)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
