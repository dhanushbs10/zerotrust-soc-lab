repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local hook. `check-yaml` above is not sufficient on its own: it parses
  # successfully when a `---` separator is missing, because the duplicate
  # `apiVersion` key it creates is silently discarded. That is how six
  # NetworkPolicies disappeared from this repo while every other check passed.
  # This hook rejects duplicate keys outright, so a lost object is a build
  # failure rather than a missing control nobody notices.
  - repo: local
    hooks:
      - id: lab-yaml-strict
        name: strict YAML (duplicate keys, digest pins)
        entry: >-
          python tools/validate-yaml.py
          identities workloads cluster
        language: system
        pass_filenames: false
        files: \.(ya?ml)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  # The suites were run by hand, which is not a control. `af24b8c` fixed a bug
  # that the `test-tag-attack-ids.ps1` seventh fixture catches: the fix commit
  # `18a2736` shipped with that fixture already failing, because nobody re-ran
  # the suite. These are the suites that need no cluster, so they are the ones
  # that can gate a commit. Anything needing a live cluster
  # (tools/test-boundaries.ps1, the attack sweeps) stays a manual step and must
  # not be implied to be covered here.
  #
  # The three Python suites were added after an audit found they ran nowhere at
  # all -- not in this hook, not in CI. They cover the two controls that matter
  # most in this repo: that a credential cannot leave an HTTP response, and that
  # no endpoint accepts a command. Both were completely unenforced, in a
  # process whose documented job is minting cluster-admin tokens.
  - repo: local
    hooks:
      - id: lab-selftest
        name: cluster-free test suites
        entry: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/run-selftests.ps1
        language: system
        pass_filenames: false
        files: \.(ps1|py|ya?ml)$
